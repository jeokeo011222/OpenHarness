name: E2E (real DeepSeek API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Unlike ci.yml this job
# consumes the DEEPSEEK_API_KEY_EXTERNAL secret (mapped to the env var
# DEEPSEEK_API_KEY the tests read) and hits the external API at
# https://api.deepseek.com/anthropic (DEEPSEEK_BASE_URL is pinned explicitly so a
# stray repo-root .env can't redirect the run).
#
# pull_request IS a trigger, but GitHub withholds repo secrets from BOTH forked
# PRs and Dependabot PRs (the latter are same-repo, fork==false, but still
# keyless). The job-level `if:` below skips the whole job for those untrusted
# PRs and for any repository that never configured the secret: the `preflight`
# guard job publishes whether DEEPSEEK_API_KEY_EXTERNAL resolved non-empty,
# because a job-level `if:` cannot read secrets directly. A fork without the key
# therefore skips the e2e job instead of failing every push and nightly run
# (the suites would self-skip anyway), while a configured key still runs the
# real suite. The Dependabot test keys on the PR AUTHOR
# (pull_request.user.login), not github.actor (the run trigger) — a maintainer
# reopening a Dependabot PR would make github.actor human while the PR is still
# keyless. A job skipped by a job-level `if:` reports as a SUCCESSFUL check, so
# this workflow is safe to use as a required status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Keep only the newest validation in each workflow/ref, including master
# pushes, nightly runs, and manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Secrets are unreadable in a job-level `if:`, so this guard publishes the
  # fact and `e2e` consumes it. The step never prints the value; it only reports
  # whether the secret resolved non-empty.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEEPSEEK_API_KEY_EXTERNAL is not configured; skipping the real-API e2e job."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    name: e2e
    needs: preflight
    # Run only when the guard found the key and the event is trusted. Untrusted
    # PRs (forks + Dependabot) never receive the secret; a keyless repository
    # skips instead of hard-failing its preflight.
    if: >-
      needs.preflight.outputs.has_key == 'true'
      && (github.event_name != 'pull_request'
          || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]'))
    # Profile e2e files can each own several complete dsh subprocess trees, so
    # four file workers preserve process/PTY headroom. Tests retain 120s/test
    # and retry 2; 45m still bounds retry storms against a slow API.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # The preflight guard already established that DEEPSEEK_API_KEY_EXTERNAL
      # resolved non-empty, so the test step below cannot report an all-skipped
      # green. The e2e suites boot the example bins in `lib` mode
      # (DSH_EXAMPLE_MODE=lib): the built artifact under plain Node, resolving
      # plugins through real package exports — the shape a real consumer runs.
      # That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: ${{ github.event_name == 'pull_request' && 'pnpm run build:artifacts --profile official' || 'pnpm run build:official' }}

      - name: Prepare Office runtime
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-office

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      # DEEPSEEK_BASE_URL is pinned to the external API; the secret is scoped to
      # this step (and preflight) only — never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/anthropic
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_E2E_MAX_WORKERS: 6
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
