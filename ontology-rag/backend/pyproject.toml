[project]
name = "ontorag-backend"
version = "1.0.0"
description = "本体制导 RAG：本体优先检索 + SHACL 强制校验的政企问答服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pymysql>=1.1",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
# 仅 RETRIEVAL_BACKEND=es 的既有部署需要；测试期用 pgvector，不装这两个包
es = [
    "elasticsearch>=8.15",
    "pymilvus>=2.4",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
